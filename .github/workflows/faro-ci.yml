name: faro-ci

on:
  push:
    paths: ["faro/**", ".github/workflows/faro-ci.yml"]
  pull_request:
    paths: ["faro/**", ".github/workflows/faro-ci.yml"]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: faro/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check app tests && ruff format --check app tests
      - run: pytest -q

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: faro/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
