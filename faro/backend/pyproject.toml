[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "faro-backend"
version = "0.1.0"
description = "Backend de IA de Faro: visión, navegación peatonal, Uber y comandos de voz para personas con discapacidad visual"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "pillow>=10.3",
  "numpy>=1.26",
  "anthropic>=1.0",
  "openai>=1.50",
]

[project.optional-dependencies]
# Detección local con YOLOv8 (pesado: instala torch). Sin esto el backend usa solo el VLM.
vision = ["ultralytics>=8.3", "opencv-python-headless>=4.10"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # Depends()/File() en defaults es el idioma de FastAPI
